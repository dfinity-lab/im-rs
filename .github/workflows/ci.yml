name: Continuous Integration
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 1,15 * *"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        crate: [im, im-rc]
        rust: [stable, beta, nightly]
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: hecrj/setup-rust-action@50a120e4d34903c2c1383dec0e9b1d349a9cc2b1 # v1
        with:
          rust-version: ${{ matrix.rust }}
      - name: Install cargo tooling
        run: cargo install cargo-make cargo-script
      - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
      - name: Prepare distribution folders
        run: cargo make prepare-release
      - name: Run tests
        run: |
          cd dist/${{ matrix.crate }}
          cargo test --all-features
          cargo test --no-default-features

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: hecrj/setup-rust-action@50a120e4d34903c2c1383dec0e9b1d349a9cc2b1 # v1
        with:
          rust-version: stable
          components: clippy
      - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
      - name: Clippy
        run: cargo clippy -- -D warnings
